    <h1>Life Cycle Method in Angular</h1>
    <button (click)="updateCounter()">Count: {{counter}}</button>
    <div *ngIf="counter != 5">
        <app-lifecycle [counter]="counter" #lifecycle></app-lifecycle>
    </div>

    <button (click)="getProductData()">Load Product Data</button>

    @for (user of productData; track $index) {
        <ul>
            <li>Name: {{user.name}}</li>
            <li>Branch: {{user.branch}}</li>
            <li>Price: {{user.price}}</li>
        </ul>
    }
